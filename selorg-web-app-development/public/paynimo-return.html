<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Selorg Payment Return</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <p>Completing payment…</p>
    <script>
      (function () {
        // Legacy Paynimo return target. Forward query + form body to the API callback,
        // which verifies and redirects to /payment?paynimo_bridge=1&…
        var apiReturn =
          (window.__SELORG_WORLDLINE_RETURN_URL__ ||
            "http://localhost:3333/api/v1/customer/payments/worldline/return");
        var params = new URLSearchParams(window.location.search || "");
        var form = document.createElement("form");
        form.method = "POST";
        form.action = apiReturn;
        form.style.display = "none";
        params.forEach(function (value, key) {
          var input = document.createElement("input");
          input.type = "hidden";
          input.name = key;
          input.value = value;
          form.appendChild(input);
        });
        document.body.appendChild(form);
        form.submit();
      })();
    </script>
  </body>
</html>
